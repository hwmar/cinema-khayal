<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سینەما خەیاڵ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --primary-color: #e50914;
        }

        .light-mode {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #000000;
            --primary-color: #e50914;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 15px;
            transition: all 0.3s ease;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--primary-color);
        }

        h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 22px;
        }

        button.theme-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
        }

        .search-filter {
            margin: 20px 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        input, select {
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #444;
            background: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .movie-card {
            background: var(--card-bg);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .movie-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .movie-title {
            font-size: 14px;
            margin: 8px 0 4px 0;
            font-weight: bold;
        }

        .movie-genre {
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .trailer-btn {
            background: #2196F3;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>🎬 سینەما خەیاڵ</h1>
        <button class="theme-btn" onclick="toggleTheme()">دۆخی ڕۆژ/شەو</button>
    </header>

    <div class="search-filter">
        <input type="text" id="searchInput" onkeyup="filterMovies()" placeholder="گەڕان بۆ فیلم...">
        <select id="genreSelect" onchange="filterMovies()">
            <option value="all">هەموو جۆرەکان</option>
            <option value="ئەکشن">ئەکشن</option>
            <option value="دراما">دراما</option>
            <option value="کۆمیدی">کۆمیدی</option>
            <option value="ترسناک">ترسناک</option>
        </select>
    </div>

    <div class="movie-grid" id="movieList">
        <div class="movie-card" data-genre="دراما">
            <img src="https://m.media-amazon.com/images/M/MV5BMDFkYTc0MGEtZmNhMC00ZDIzLWFmNTEtODM1ZmRlYWMwMWFmXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" alt="The Shawshank Redemption">
            <div class="movie-title">Shawshank Redemption</div>
            <div class="movie-genre">دراما</div>
            <a href="https://www.youtube.com/watch?v=6hB3S9bIaco" target="_blank" class="trailer-btn">سەیرکردنی ترایلەر 🍿</a>
        </div>

        <div class="movie-card" data-genre="دراما">
            <img src="https://m.media-amazon.com/images/M/MV5BM2MyNjYxNmUtYTAwNi00MTYxLWJmNWYtYzZlODY3ZTk3OTFlXkEyXkFqcGdeQXVyNzkwMjQ5NzM@._V1_.jpg" alt="The Godfather">
            <div class="movie-title">The Godfather</div>
            <div class="movie-genre">دراما / تاوان</div>
            <a href="https://www.youtube.com/watch?v=sY1S349gQ4U" target="_blank" class="trailer-btn">سەیرکردنی ترایلەر 🍿</a>
        </div>

        <div class="movie-card" data-genre="ئەکشن">
            <img src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg" alt="The Dark Knight">
            <div class="movie-title">The Dark Knight</div>
            <div class="movie-genre">ئەکشن</div>
            <a href="https://www.youtube.com/watch?v=EXeTwQWrcwY" target="_blank" class="trailer-btn">سەیرکردنی ترایلەر 🍿</a>
        </div>

        <div class="movie-card" data-genre="کۆمیدی">
            <img src="https://m.media-amazon.com/images/M/MV5BMTM0NTczMTMyM15BMl5BanBnXkFtZTcwMzA2MTI3MQ@@._V1_.jpg" alt="Home Alone">
            <div class="movie-title">Home Alone</div>
            <div class="movie-genre">کۆمیدی</div>
            <a href="https://www.youtube.com/watch?v=jEDaVHmw7rI" target="_blank" class="trailer-btn">سەیرکردنی ترایلەر 🍿</a>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle("light-mode");
        }

        function filterMovies() {
            let searchVal = document.getElementById("searchInput").value.toLowerCase();
            let genreVal = document.getElementById("genreSelect").value;
            let cards = document.querySelectorAll(".movie-card");

            cards.forEach(card => {
                let title = card.querySelector(".movie-title").innerText.toLowerCase();
                let genre = card.getAttribute("data-genre");

                let matchesSearch = title.includes(searchVal);
                let matchesGenre = (genreVal === "all" || genre === genreVal);

                if (matchesSearch && matchesGenre) {
                    card.style.display = "flex";
                } else {
                    card.style.display = "none";
                }
            });
        }
    </script>
</body>
</html>
