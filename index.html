<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سینەما خەیاڵ</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #ffffff;
            --primary-color: #e50914;
        }

        .light-mode {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #121212;
            --primary-color: #e50914;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            background-color: #000000;
            padding: 20px;
            text-align: center;
            position: relative;
        }

        header h1 {
            margin: 0;
            color: var(--primary-color);
            font-size: 2.5em;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            flex-wrap: wrap;
        }

        input[type="text"], select {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 1em;
        }

        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .movie-info {
            padding: 15px;
            text-align: center;
        }

        .movie-title {
            font-size: 1.2em;
            margin: 10px 0 5px;
        }

        .movie-genre {
            color: #888;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .btn-trailer {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            text-decoration: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 5px;
        }

        .btn-trailer:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <header>
        <button class="theme-toggle" onclick="toggleTheme()">گۆڕینی ڕوکار</button>
        <h1>سینەما خەیاڵ</h1>
    </header>

    <div class="controls">
        <input type="text" id="searchInput" onkeyup="filterMovies()" placeholder="گەڕان بۆ فیلم...">
        <select id="genreSelect" onchange="filterMovies()">
            <option value="all">هەموو جۆرەکان</option>
            <option value="ئەکشن">ئەکشن</option>
            <option value="دراما">دراما</option>
            <option value="کۆمیدی">کۆمیدی</option>
            <option value="زانستی">زانستی</option>
        </select>
    </div>

    <div class="movies-grid" id="moviesGrid">
        <div class="movie-card" data-genre="ئەکشن" data-title="Inception">
            <img src="https://m.media-amazon.com/images/M/MV5BMjAxMzY3NjcxNF5BMl5BanBnXkFtZTcwNTI5OTM0Mw@@._V1_.jpg" alt="Inception">
            <div class="movie-info">
                <div class="movie-title">Inception</div>
                <div class="movie-genre">جۆر: ئەکشن / زانستی</div>
                <a href="https://www.youtube.com/results?search_query=Inception+trailer" target="_blank" class="btn-trailer">سەیرکردنی ترایلەر</a>
            </div>
        </div>

        <div class="movie-card" data-genre="دراما" data-title="The Shawshank Redemption">
            <img src="https://m.media-amazon.com/images/M/MV5BMDFkYTc0MGEtZmNhMC00ZDIzLWFmNTEtODM1ZmRlYWMwMWFmXkEyXkFqcGdeQXVyMTMxODk2OTU@._V1_.jpg" alt="Shawshank">
            <div class="movie-info">
                <div class="movie-title">The Shawshank Redemption</div>
                <div class="movie-genre">جۆر: دراما</div>
                <a href="https://www.youtube.com/results?search_query=The+Shawshank+Redemption+trailer" target="_blank" class="btn-trailer">سەیرکردنی ترایلەر</a>
            </div>
        </div>

        <div class="movie-card" data-genre="ئەکشن" data-title="The Dark Knight">
            <img src="https://m.media-amazon.com/images/M/MV5BMTMxNTMwODM0NF5BMl5BanBnXkFtZTcwODAyMTk2Mw@@._V1_.jpg" alt="Dark Knight">
            <div class="movie-info">
                <div class="movie-title">The Dark Knight</div>
                <div class="movie-genre">جۆر: ئەکشن</div>
                <a href="https://www.youtube.com/results?search_query=The+Dark+Knight+trailer" target="_blank" class="btn-trailer">سەیرکردنی ترایلەر</a>
            </div>
        </div>

        <div class="movie-card" data-genre="کۆمیدی" data-title="The Mask">
            <img src="https://m.media-amazon.com/images/M/MV5BOWExYjI5MzktNTRhNi00Nzg2LThkZmItM2M1Y2U4ZTFmM2VkXkEyXkFqcGdeQXVyMTQxNzMzNDI@._V1_.jpg" alt="The Mask">
            <div class="movie-info">
                <div class="movie-title">The Mask</div>
                <div class="movie-genre">جۆر: کۆمیدی</div>
                <a href="https://www.youtube.com/results?search_query=The+Mask+trailer" target="_blank" class="btn-trailer">سەیرکردنی ترایلەر</a>
            </div>
        </div>
    </div>

    <script>
        function toggleTheme() {
            document.body.classList.toggle('light-mode');
        }

        function filterMovies() {
            const searchInput = document.getElementById('searchInput').value.toLowerCase();
            const genreSelect = document.getElementById('genreSelect').value;
            const movies = document.querySelectorAll('.movie-card');

            movies.forEach(movie => {
                const title = movie.getAttribute('data-title').toLowerCase();
                const genre = movie.getAttribute('data-genre');

                const matchesSearch = title.includes(searchInput);
                const matchesGenre = (genreSelect === 'all' || genre === genreSelect);

                if (matchesSearch && matchesGenre) {
                    movie.style.display = 'flex';
                } else {
                    movie.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
